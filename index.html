<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kru Pai Classroom — Click-to-Order (Daily Questions · Set 5 · Matrix Cute Deluxe v2)</title>
<style>
:root{ --bg:#0b1020; --grid:#101735; --ink:#e5f2ff; --muted:#9fb6ff; --neon1:#22d3ee; --neon2:#a78bfa; --neon3:#f472b6; --accent:#22c55e; --danger:#fb7185; }
*{box-sizing:border-box}
html,body{height:100%}
body.matrix-bg{ margin:0; color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif; background:
  radial-gradient(1200px 600px at 20% -10%, rgba(167,139,250,.22), transparent 60%),
  radial-gradient(1000px 600px at 120% 20%, rgba(34,211,238,.22), transparent 55%),
  linear-gradient(180deg,#0b1020 0%, #0b1125 100%); overflow-x:hidden; }
body.matrix-bg::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px); background-size:60px 60px; animation:gridMove 14s linear infinite; opacity:.25; }
@keyframes gridMove{ from{ transform:translateY(0)} to{ transform:translateY(60px) } }
header{ position:sticky; top:0; z-index:20; background:linear-gradient(90deg, rgba(34,211,238,.25), rgba(167,139,250,.25), rgba(244,114,182,.25)); backdrop-filter: blur(8px); border-bottom:1px solid rgba(255,255,255,.08); color:#fff; padding:10px 14px; font-weight:900; letter-spacing:.3px; text-shadow:0 0 10px rgba(167,139,250,.55); display:flex; align-items:center; justify-content:space-between; gap:10px; }
header .title{display:block}
header .sound-toggle{cursor:pointer; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:6px 10px; font-weight:800; color:#06121f; background:rgba(255,255,255,.8)}
.wrap{max-width:980px; margin:0 auto; padding:18px; position:relative; z-index:1}
.card{ background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:18px; box-shadow:0 16px 48px rgba(0,0,0,.45), inset 0 0 30px rgba(34,211,238,.05); }
.center{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; min-height:62vh; text-align:center}
.btn{cursor:pointer; border:0; padding:12px 18px; border-radius:16px; font-weight:900; font-size:1.02rem; transition:transform .08s ease, box-shadow .18s ease, filter .18s; color:#06121f}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#22d3ee,#60a5fa); box-shadow:0 12px 28px rgba(34,211,238,.35), 0 0 40px rgba(34,211,238,.25)}
.btn-secondary{background:linear-gradient(180deg,#f472b6,#a78bfa); color:#0a1022; box-shadow:0 10px 24px rgba(244,114,182,.35)}
.btn-ghost{background:rgba(255,255,255,.08); color:#e5e7eb; border:1px solid rgba(255,255,255,.14)}
.chipbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px}
.word{ border:1px solid rgba(34,211,238,.55); background:rgba(3,7,18,.45); padding:10px 14px; border-radius:999px; font-weight:800; font-size:1.05rem; color:#dcf3ff; cursor:pointer; user-select:none; transition:transform .08s ease, background .2s, box-shadow .2s; box-shadow:0 0 18px rgba(34,211,238,.25), inset 0 0 18px rgba(34,211,238,.08); text-shadow:0 0 8px rgba(34,211,238,.35); }
.word:hover{box-shadow:0 0 26px rgba(34,211,238,.45)}
.word:active{transform:scale(.95)}
.word.disabled{opacity:.35; cursor:not-allowed; box-shadow:none; text-shadow:none}
.slot{min-height:62px; border:2px dashed rgba(167,139,250,.45); border-radius:16px; padding:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); box-shadow:inset 0 0 26px rgba(167,139,250,.15)}
.answer-chip{ border:1px solid rgba(244,114,182,.6); background:rgba(244,114,182,.15); color:#ffe9f6; padding:10px 14px; border-radius:999px; font-weight:900; font-size:1.05rem; cursor:pointer; animation:pop .15s ease-out; text-shadow:0 0 8px rgba(244,114,182,.35); box-shadow:0 0 18px rgba(244,114,182,.35), inset 0 0 12px rgba(244,114,182,.2) }
@keyframes pop{from{transform:scale(.92); opacity:.5} to{transform:scale(1); opacity:1)}
@keyframes shake{10%{transform:translateX(-4px)} 20%{transform:translateX(4px)} 30%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 50%{transform:translateX(-2px)} 60%{transform:translateX(2px)} 100%{transform:translateX(0)}}
.shake{animation:shake .45s ease}
.msg{margin-top:12px; font-weight:900}
.msg.ok{color:var(--accent)} .msg.no{color:var(--danger)}
/* ===== FX: Confetti (mobile-safe) ===== */
#fx{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:99998}
.confetti{ position:fixed; left:50vw; top:35vh; width:10px; height:10px; border-radius:2px; opacity:.98; will-change:transform,opacity; z-index:99999; animation:fall3d 1.8s linear forwards }
@keyframes fall3d{
  0%{ transform:translate3d(0,0,0) rotate3d(1,1,0,0deg) }
  100%{ transform:translate3d(var(--dx), var(--dy), 0) rotate3d(1,1,0,1080deg); opacity:0 }
}
#celebrate{position:fixed; inset:0; display:none; place-items:center; z-index:99997; pointer-events:none}
.sparkle{font-size:3.2rem; font-weight:900; color:#fff; text-shadow:0 0 22px #f472b6, 0 0 44px #22d3ee, 0 0 66px #a78bfa; animation:pulse 1.4s ease-out forwards}
@keyframes pulse{0%{opacity:0; transform:scale(.2)} 40%{opacity:1; transform:scale(1.05)} 100%{opacity:0; transform:scale(1.6)}}
input#player{width:min(520px,92%);padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:1.05rem;box-shadow:inset 0 0 0 2px rgba(167,139,250,.18)}
input#player:focus{outline:none;box-shadow:inset 0 0 0 2px var(--neon2)}
@media(max-width:480px){ .word,.answer-chip{font-size:1rem;padding:9px 12px} .slot{min-height:56px} .sparkle{font-size:2.4rem} }
</style>
</head>
<body class="matrix-bg">
  <div id="fx"></div>
  <header>
    <span class="title">Kru Pai Classroom · Click-to-Order — Daily Questions (Set 5)</span>
    <button id="soundBadge" class="sound-toggle">🔊 เสียง: เปิด</button>
  </header>
  <main class="wrap">
    <section class="card center" id="screen-start">
      <h1>Matrix Cute ✨ Deluxe Edition</h1>
      <p class="label" style="color:var(--muted)">กรอกชื่อเล่น แล้วกดเริ่มเกม — ชุดคำถามชีวิตประจำวัน 20 ข้อ</p>
      <input id="player" placeholder="ชื่อเล่น" />
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary" id="btnStart">เริ่มเกม ✨</button>
      </div>
    </section>

    <section class="card" id="screen-game" style="display:none">
      <div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px">
        <div id="progress" class="label" style="color:var(--muted)">ข้อ 1/20</div>
        <div id="score" class="label" style="color:var(--muted)">คะแนน 0</div>
      </div>
      <h2 id="thaiHint" style="margin-top:0">—</h2>
      <div id="wordBank" class="chipbar" aria-label="คลังคำ"></div>
      <div id="answerSlot" class="slot" aria-label="พื้นที่จัดเรียงคำ"></div>
      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-ghost" id="btnUndo">↩️ ย้อนคำ</button>
        <button class="btn btn-secondary" id="btnShow">ดูเฉลย 👀</button>
        <button class="btn btn-primary" id="btnSubmit">ตรวจคำตอบ ✅</button>
      </div>
      <div id="message" class="msg"></div>
      <div id="solution" class="label" style="color:var(--muted)"></div>
    </section>

    <section class="card center" id="screen-result" style="display:none">
      <h2>สรุปคะแนน 🎉</h2>
      <div id="finalName" class="label" style="color:var(--muted)"></div>
      <div id="finalScore" style="font-size:1.6rem;font-weight:900"></div>
      <button class="btn btn-primary" id="btnReplay">เล่นอีกครั้ง</button>
    </section>
  </main>

  <div id="celebrate"><div class="sparkle">เยี่ยมมาก! 🌟</div></div>

<script>
const $=(s)=>document.querySelector(s);
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tokensEqual(a,b){ if(!b||a.length!==b.length) return false; for(let i=0;i<a.length;i++){ if((a[i]||'').toLowerCase()!==(b[i]||'').toLowerCase()) return false; } return true; }
function prettyJoin(t){ return t.join(' ').replace(/\s+([?!.,;:])/g,'$1'); }

let audioEnabled=true; let ac; 
function ensureAC(){ if(!ac){ ac = new (window.AudioContext||window.webkitAudioContext)(); } }
function beep(freq=880, dur=0.12, type='triangle', vol=0.09){ if(!audioEnabled) return; ensureAC(); const o=ac.createOscillator(); const g=ac.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur); }
function clickFX(){ beep(760,0.06,'sine',0.06); }
function correctFX(){ beep(980,0.1,'triangle',0.1); setTimeout(()=>beep(1320,0.12,'triangle',0.1), 80); }
function wrongFX(){ beep(240,0.12,'sawtooth',0.08); setTimeout(()=>beep(200,0.12,'sawtooth',0.08), 90); }

const questions=[
{hint:"ห้องเรียนอยู่ที่ไหน", ans:["Where","is","the","classroom","?"], words:["Where","the","is","classroom","?"]},
{hint:"คุณทำการบ้านเมื่อไหร่", ans:["When","do","you","do","your","homework","?"], words:["do","homework","you","When","your","do","?"]},
{hint:"คุณชอบกินอะไรเป็นของหวาน", ans:["What","dessert","do","you","like","?"], words:["dessert","do","you","What","like","?"]},
{hint:"ทำไมคุณหัวเราะ", ans:["Why","are","you","laughing","?"], words:["are","laughing","Why","you","?"]},
{hint:"คุณไปโรงเรียนกับใคร", ans:["Who","do","you","go","to","school","with","?"], words:["with","do","you","go","Who","to","school","?"]},
{hint:"ห้องน้ำอยู่ที่ไหน", ans:["Where","is","the","bathroom","?"], words:["the","Where","is","bathroom","?"]},
{hint:"รถบัสมาถึงเมื่อไหร่", ans:["When","does","the","bus","arrive","?"], words:["When","arrive","the","does","bus","?"]},
{hint:"วันนี้วันอะไร", ans:["What","day","is","it","today","?"], words:["today","What","day","is","it","?"]},
{hint:"ทำไมคุณง่วง", ans:["Why","are","you","sleepy","?"], words:["you","sleepy","are","Why","?"]},
{hint:"คุณอาศัยอยู่ที่ไหน", ans:["Where","do","you","live","?"], words:["Where","you","do","live","?"]},
{hint:"คุณดื่มน้ำวันละกี่แก้ว", ans:["How","many","glasses","of","water","do","you","drink","a","day","?"], words:["many","a","drink","How","glasses","of","day","you","do","water","?"]},
{hint:"คุณสูงแค่ไหน", ans:["How","tall","are","you","?"], words:["tall","you","How","are","?"]},
{hint:"คุณใช้ดินสอสีอะไร", ans:["What","color","pencil","do","you","use","?"], words:["do","pencil","color","What","use","you","?"]},
{hint:"เราจะพบกันเมื่อไหร่", ans:["When","will","we","meet","?"], words:["we","When","meet","will","?"]},
{hint:"คุณไปโรงเรียนอย่างไร", ans:["How","do","you","get","to","school","?"], words:["How","to","get","you","school","do","?"]},
{hint:"ใครเป็นเพื่อนสนิทของคุณ", ans:["Who","is","your","best","friend","?"], words:["your","Who","friend","best","is","?"]},
{hint:"ทำไมคุณชอบวิชาวิทยาศาสตร์", ans:["Why","do","you","like","science","?"], words:["science","you","Why","like","do","?"]},
{hint:"ร้านหนังสืออยู่ที่ไหน", ans:["Where","is","the","bookstore","?"], words:["Where","bookstore","the","is","?"]},
{hint:"เวลาพักเริ่มเมื่อไหร่", ans:["When","does","the","break","start","?"], words:["the","does","start","When","break","?"]},
{hint:"คุณฟังเพลงอะไร", ans:["What","music","do","you","listen","to","?"], words:["to","music","What","listen","you","do","?"]}
];

let idx=0,score=0,picked=[];const qs=questions; const start=$('#screen-start'), game=$('#screen-game'), result=$('#screen-result'); const soundBadge=$('#soundBadge');

function confettiBurst(amount=80){ // mobile-safe confetti
  const fx=$('#fx'); const colors=['#22d3ee','#a78bfa','#f472b6','#22c55e','#fbbf24'];
  for(let i=0;i<amount;i++){
    const el=document.createElement('div'); el.className='confetti';
    const dx=((Math.random()*2-1)*(220+Math.random()*200))+ 'px';
    const dy=((Math.random()*1+0.8)*(420+Math.random()*320))+ 'px';
    el.style.setProperty('--dx', dx); el.style.setProperty('--dy', dy); el.style.background=colors[(Math.random()*colors.length)|0];
    fx.appendChild(el); setTimeout(()=>el.remove(), 1900);
  }
}

function bigCelebrate(){ const layer=$('#celebrate'); layer.style.display='grid'; const el=layer.firstElementChild; el.style.animation='none'; layer.offsetHeight; el.style.animation='pulse 1.4s ease-out forwards'; setTimeout(()=> layer.style.display='none', 1450); }

function build(){ const q=qs[idx]; $('#thaiHint').textContent=q.hint; $('#progress').textContent=`ข้อ ${idx+1}/${qs.length}`; $('#score').textContent=`คะแนน ${score}`; picked=[]; const wb=$('#wordBank'), slot=$('#answerSlot'); wb.innerHTML=''; slot.innerHTML=''; shuffle(q.words).forEach(w=>{ const b=document.createElement('button'); b.className='word'; b.textContent=w; b.onclick=()=>{ if(b.classList.contains('disabled')) return; b.classList.add('disabled'); const c=document.createElement('button'); c.className='answer-chip'; c.textContent=w; c.onclick=()=>{ c.remove(); b.classList.remove('disabled'); picked=picked.filter(x=>x!==w); clickFX(); }; slot.appendChild(c); picked.push(w); clickFX(); }; wb.appendChild(b); }); }

function check(){ const q=qs[idx]; if(picked.join(' ')==q.ans.join(' ')){ score++; $('#message').textContent='ถูกต้องจ้า ✅'; $('#solution').textContent=''; correctFX(); confettiBurst(); bigCelebrate(); setTimeout(()=>{ idx++; if(idx>=qs.length){ finish(); } else { build(); } }, 900); } else { $('#message').textContent='ยังไม่ถูก ❌'; $('#solution').textContent='เฉลย: '+prettyJoin(q.ans); const slot=$('#answerSlot'); slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake'); wrongFX(); } }

function finish(){ game.style.display='none'; result.style.display='flex'; $('#finalName').textContent='เก่งมาก!'; $('#finalScore').textContent=`ได้ ${score}/${qs.length}`; confettiBurst(120); bigCelebrate(); }

function startGame(){ start.style.display='none'; game.style.display='block'; idx=0; score=0; build(); }

$('#btnStart').onclick=startGame; $('#btnUndo').onclick=()=>{ const slot=$('#answerSlot'); const chips=slot.querySelectorAll('.answer-chip'); if(chips.length){ chips[chips.length-1].click(); }}; $('#btnShow').onclick=()=>{ $('#solution').textContent='เฉลย: '+prettyJoin(qs[idx].ans) }; $('#btnSubmit').onclick=check; $('#btnReplay').onclick=()=>{ result.style.display='none'; startGame(); };

soundBadge.addEventListener('click',()=>{ audioEnabled=!audioEnabled; soundBadge.textContent = audioEnabled? '🔊 เสียง: เปิด' : '🔇 เสียง: ปิด'; if(audioEnabled){ clickFX(); }});
['click','touchstart','keydown'].forEach(evt=>document.addEventListener(evt,()=>{ if(ac && ac.state==='suspended'){ ac.resume(); } },{passive:true, once:false}));
</script>
</body>
</html>
